<!doctype html>
<html lang="en" data-aigenius-desktop-shell="1">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" href="/logo.png" />
    <title>AIGenius</title>
    <style id="color-mode-bootstrap-critical">
      html.dark,html.dark body,html[data-theme=dark],html[data-theme=dark] body{background-color:#0b0b0e;color:#e8eaef;color-scheme:dark}
    </style>
    <script id="color-mode-bootstrap">
      (function(){try{var ck="aigenius-color-mode";var lk="aigenius-theme";var cm=localStorage.getItem(ck);var lt=localStorage.getItem(lk);var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;var resolved='light';if(cm==='dark'||cm==='light'){resolved=cm;}else if(lt==='dark'||lt==='light'){resolved=lt;}else{resolved=prefersDark?'dark':'light';}var r=document.documentElement;r.setAttribute('data-theme',resolved);r.style.colorScheme=resolved;if(resolved==='dark'){r.classList.add('dark');}else{r.classList.remove('dark');}}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
