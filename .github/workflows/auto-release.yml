name: Automated Desktop Release & Silent OTA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  classify-and-release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: yarn install --ignore-engines

      - name: Detect Release Type & Compatibility Contract
        id: detect
        run: node desktop/scripts/auto-detect-release.cjs

      # ── BRANCH 1: SILENT UI OTA (No native files touched) ───────────────
      - name: Build & Package Silent UI Bundle
        if: steps.detect.outputs.release_type == 'UI_OTA'
        run: |
          yarn workspace aigenius-desktop run package:ui:ota --min-desktop-version ${{ steps.detect.outputs.min_desktop_version }}

      - name: Publish Silent OTA to Cloudflare CDN
        if: steps.detect.outputs.release_type == 'UI_OTA'
        run: node desktop/scripts/publish-ui-ota-r2.cjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

      # ── BRANCH 2: NATIVE UPDATE (Store Submission Required) ──────────────
      - name: Build Full Native MSIX Package for Microsoft Store
        if: steps.detect.outputs.release_type == 'NATIVE_REQUIRED'
        run: yarn workspace aigenius-desktop run package:win:appx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Standalone Windows NSIS Setup
        if: steps.detect.outputs.release_type == 'NATIVE_REQUIRED'
        run: yarn workspace aigenius-desktop run package:win

      - name: Upload Microsoft Store MSIX Artifact
        if: steps.detect.outputs.release_type == 'NATIVE_REQUIRED'
        uses: actions/upload-artifact@v4
        with:
          name: AIGenius-Store-Package
          path: desktop/release/*.appx

      - name: Package Matched UI Bundle for New Native Shell
        if: steps.detect.outputs.release_type == 'NATIVE_REQUIRED'
        run: |
          yarn workspace aigenius-desktop run package:ui:ota --min-desktop-version ${{ steps.detect.outputs.min_desktop_version }}

      - name: Publish Matched UI to Cloudflare CDN for New Native Shell
        if: steps.detect.outputs.release_type == 'NATIVE_REQUIRED'
        run: node desktop/scripts/publish-ui-ota-r2.cjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
